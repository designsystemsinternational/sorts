[package]
name = "sorts"
version = "0.4.0"
edition = "2024"
description = "A font manager CLI for macOS with a shared Fonts folder and personal settings"
license = "MIT"
repository = "https://github.com/designsystemsinternational/sorts"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
objc2-core-foundation = "0.3.2"
objc2-core-text = "0.3.2"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ttf-parser = "0.25.1"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
